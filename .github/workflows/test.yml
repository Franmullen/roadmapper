name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model and agent tests
        run: node --test packages/roadmapper/tests/
      - name: The release zip builds
        run: python3 scripts/package.py
