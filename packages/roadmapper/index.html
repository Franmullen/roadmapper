<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmapper</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/assets/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/assets/celbridge-client/celbridge.css">
    <link rel="stylesheet" href="css/board.css">
</head>
<body>
    <header id="toolbar">
        <label class="root-field" title="The folder whose subfolders are the milestones">
            <i class="bi bi-folder2"></i>
            <input type="text" id="root-input" spellcheck="false" autocomplete="off" placeholder="plans">
        </label>
        <span id="summary"></span>
        <span class="spacer"></span>
        <button type="button" id="refresh" class="cel-icon-button" title="Refresh" aria-label="Refresh">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
    </header>

    <div id="message" hidden>
        <p id="message-text"></p>
        <button type="button" id="create-root" class="cel-accent" hidden>Create folder</button>
    </div>

    <main id="board"></main>

    <script type="module" src="js/board.js"></script>
</body>
</html>
